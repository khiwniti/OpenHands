# Railway Configuration for OpenHands
# Documentation: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "./containers/app/Dockerfile"

[deploy]
startCommand = "sh -c 'uvicorn openhands.server.listen:app --host 0.0.0.0 --port ${PORT:-3000}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Railway provides $PORT environment variable automatically
# healthcheckPath = "/health"
# healthcheckTimeout = 100

# Example: uncomment to use a specific region
# region = "us-west1"
